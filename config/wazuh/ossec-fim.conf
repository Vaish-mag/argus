<!--
  Argus FIM + active-response configuration snippets.
  Merge these blocks into /var/ossec/etc/ossec.conf on the Wazuh agent that monitors
  the WSL2 host (the host that owns ./runtime/webroot).

  1) syscheck: watch the bind-mounted web root in REAL TIME so detection latency (MTTD)
     is seconds, not the default scan interval.
  2) command + active-response: when an argus_breach rule (id 100200-100202) fires, run
     argus-quarantine.sh, which simply drops runtime/breach.flag. The Argus controller
     tails that flag -- keeping Wazuh responsible for DETECTION and Argus responsible for
     the HEALING logic (clean separation you can defend in the viva).
-->

<!-- ============================ FILE INTEGRITY ============================ -->
<syscheck>
  <disabled>no</disabled>
  <!-- real-time monitoring of the protected web root (adjust to your WSL2 path) -->
  <directories check_all="yes" realtime="yes" report_changes="yes">/home/&lt;you&gt;/argus/runtime/webroot</directories>
  <!-- do not alert on Wazuh's own noise -->
  <frequency>43200</frequency>
  <alert_new_files>yes</alert_new_files>
</syscheck>

<!-- ============================ ACTIVE RESPONSE =========================== -->
<command>
  <name>argus-quarantine</name>
  <executable>argus-quarantine.sh</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

<active-response>
  <command>argus-quarantine</command>
  <location>local</location>
  <rules_group>argus_breach</rules_group>
</active-response>
